name: Android MVP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_TEMPLATE_VERSION: 4.7.2.stable
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install official Godot editor and templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl --fail --location --retry 3 --output /tmp/godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl --fail --location --retry 3 --output /tmp/templates.tpz "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          unzip -q /tmp/godot.zip -d "$RUNNER_TEMP/godot"
          unzip -q /tmp/templates.tpz -d "$RUNNER_TEMP/godot-templates"
          cp "$RUNNER_TEMP/godot-templates/templates/"* "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}/"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709" > /tmp/odama-sdk-install.log

      - name: Import project and configure local Android paths
        shell: bash
        run: |
          set -euo pipefail
          godot="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          "$godot" --headless --editor --path game --quit
          settings="$HOME/.config/godot/editor_settings-4.7.tres"
          test -f "$settings"
          sed -i "s|^export/android/java_sdk_path =.*|export/android/java_sdk_path = \"${JAVA_HOME}\"|" "$settings"
          sed -i "s|^export/android/android_sdk_path =.*|export/android/android_sdk_path = \"${ANDROID_HOME}\"|" "$settings"
          grep '^export/android/\(java_sdk_path\|android_sdk_path\)' "$settings"

      - name: Test race logic
        shell: bash
        run: |
          "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" --headless --path game --script res://tests/smoke.gd

      - name: Generate temporary debug signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/odama-debug.keystore" -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/odama-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game/build
          "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" --headless --path game --export-debug Android build/odama-debug.apk
          test -s game/build/odama-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: odama-android-debug
          path: game/build/odama-debug.apk
          if-no-files-found: error
          retention-days: 14
